# AIVNORA comment reply bot — GitHub Actions runner.
#
# Kyun: replyBot.js ghar ki machine par pm2 ke neeche har 3 minute chalta hai. Machine band
# ho (owner 2 din ke liye bahar) to reply rukte hain aur log keyword likh ke intezaar karte
# rehte hain — 23 Nov 2026 ko ep02 par 292 log aise hi baithe the. Ye workflow wahi bot
# cloud me chalata hai, bilkul wahi code, bina kisi server ke.
#
# State file ki zarurat NAHI hai: "dobara reply nahi" wala check Instagram se hota hai
# (replyBot.js me `already` set — comment ke neeche hamara reply pehle se hai ya nahi),
# editor-replies.json sirf record hai. Isiliye har run ka khaali runner safe hai.
#
# DHYAN: ghar ki machine aur ye, dono ek saath mat chalao. Dono live honge to ek hi bande
# ko do baar reply ja sakta hai, aur 24 Nov 2026 ka spam block isi dohraav se aaya tha.
# Yahan chalane se pehle ghar par: pm2 stop ig-poster

name: reply-bot

on:
  schedule:
    # Har 5 minute. GitHub ka cron isse tez nahi hota aur load par thoda late chalta hai,
    # to reply ~5-10 minute me jata hai (ghar par 3 minute hai).
    - cron: "*/5 * * * *"
  workflow_dispatch:        # "Run workflow" button se haath se bhi chala sakte ho

# Do run kabhi overlap na karein — ghar wale `replyBot.lock` ka yahan ka jawab.
concurrency:
  group: reply-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # 24s gap x 50 reply = 20 min; isse zyada queue agle run me
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # 18+ zaroori hai: bot global fetch use karta hai

      - run: npm install --omit=dev --no-audit --no-fund

      # --emoji wahi flag hai jo ghar ka cron deta hai (index.js).
      # --loose jaan-boojh ke NAHI hai: bin-maange ek-jaise reply hi spam block ki wajah the.
      - name: Reply to comments
        env:
          IG_AIVNORA_ACCESS_TOKEN: ${{ secrets.IG_AIVNORA_ACCESS_TOKEN }}
          IG_AIVNORA_BUSINESS_ID: ${{ secrets.IG_AIVNORA_BUSINESS_ID }}
        run: node replyBot.js --live --emoji
