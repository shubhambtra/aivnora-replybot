# AIVNORA comment reply bot — GitHub Actions runner.
#
# Kyun: replyBot.js ghar ki machine par pm2 ke neeche har 3 minute chalta hai. Machine band
# ho to reply rukte hain aur log keyword likh ke intezaar karte rehte hain — 23 Nov 2026 ko
# ep02 par 292 log aise hi baithe the. Ye workflow wahi bot cloud me chalata hai, wahi code.
#
# State file ki zarurat NAHI hai: "dobara reply nahi" wala check Instagram se hota hai
# (replyBot.js me `already` set), editor-replies.json sirf record hai.
#
# DHYAN: ghar ki machine aur ye, dono ek saath mat chalao — 24 Nov 2026 ka spam block
# dohraav se hi aaya tha. Yahan chalane se pehle ghar par: pm2 stop ig-poster

name: reply-bot

on:
  schedule:
    # 27 Nov 2026: SIRF cron par bharosa nahi kiya ja sakta. Pehle `*/5` tha aur 45 minute
    # me ek bhi scheduled run nahi chala (billing theek thi, manual run pass tha) — GitHub
    # ka schedule best-effort hai aur free account par late chalta hai ya drop ho jata hai.
    # Isliye ab cron sirf job ko JAGATA hai, aur kaam andar ke loop se hota hai (niche).
    # Har 10 min pe koshish, taki ek fire miss ho to agla jaldi aa jaye.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Ek waqt me ek hi run. Pending run queue me rehta hai, chalta hua kabhi nahi marta.
concurrency:
  group: reply-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # 18+ zaroori: bot global fetch use karta hai

      - run: npm install --omit=dev --no-audit --no-fund

      # Andar ka loop: ek run ~55 minute tak har 2 minute par bot chalata hai. Isse ek
      # scheduled fire bhi poora ghanta cover kar deta hai, aur GitHub ke cron ke late
      # hone ya drop hone se reply nahi rukte.
      #
      # --emoji wahi flag hai jo ghar ka cron deta hai (index.js).
      # --loose jaan-boojh ke NAHI: bin-maange ek-jaise reply hi spam block ki wajah the.
      - name: Reply to comments (55 min loop)
        env:
          IG_AIVNORA_ACCESS_TOKEN: ${{ secrets.IG_AIVNORA_ACCESS_TOKEN }}
          IG_AIVNORA_BUSINESS_ID: ${{ secrets.IG_AIVNORA_BUSINESS_ID }}
        run: |
          END=$(( $(date +%s) + 350*60 ))
          PASS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            PASS=$((PASS+1))
            echo "::group::pass $PASS  ($(date -u +%H:%M:%S) UTC)"
            node replyBot.js --live --emoji || echo "pass $PASS failed, agle pass me try hoga"
            echo "::endgroup::"
            [ "$(date +%s)" -lt "$END" ] && sleep 120
          done
          echo "$PASS passes done"
